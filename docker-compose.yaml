services:
  frontend:
    build:
      context: ./Frontend-React
      dockerfile: Dockerfile
    container_name: frontend_app
    working_dir: /app
    volumes:
      - ./Frontend-React:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - full-network

  backend:
    build:
      context: ./Backend-Express
      dockerfile: Dockerfile
    container_name: backend_app
    working_dir: /app
    volumes:
      - ./Backend-Express:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=mysql://root:password@mysql:3306/full_stack_dev
    depends_on:
      - mysql
      - redis
    networks:
      - full-network
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma migrate dev &&
             npm run dev"

  mysql:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: full_stack_dev
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - full-network

  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    ports:
      - "3310:6379"
    networks:
      - full-network

networks:
  full-network: {}

volumes:
  mysql_data: {}
  frontend_node_modules: {}
  backend_node_modules: {}
