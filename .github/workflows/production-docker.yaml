name: CI/CD Deploy (monorepo + PM2)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_and_deploy:
    environment:
          name: VPS Hostinger

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Frontend-React/package-lock.json

      - name: Debug secret
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ SSH KEY IS EMPTY"
          else
            echo "✅ SSH KEY EXISTS"
          fi

      - name: Install frontend deps
        working-directory: Frontend-React
        run: npm ci

      - name: Build frontend
        working-directory: Frontend-React
        run: npm run build

      - name: Copy frontend build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Frontend-React/dist/*"
          target: "/var/www/Projet-Full-Stack-M1/frontend-dist"

      - name: Deploy backend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm use 22

            cd /var/www/Projet-Full-Stack-M1/Backend-Express
            git pull origin main
            npm install
            npm run build
            pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js